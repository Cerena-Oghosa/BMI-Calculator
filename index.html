<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <form id="bmi-form" novalidate>
            <h1>BMI CALCULATOR</h1>
            <p>Calculate your Body Mass Index</p>

            <div class="field">
                <label for="weight-el">Weight in Kg</label>
                <input type="number" id="weight-el" placeholder="e.g 60">
            </div>

            <div class="field">
                <label for="height-el">Height in Meters</label>
                <input type="number" id="height-el" placeholder="e.g 1.75">
            </div>

            <p id="error-el" role="alert"></p>

            <div class="action">
                <button type="submit">Calculate</button>
                <button type="reset">Reset</button>
            </div>
        </form>

        <section id="result" hidden>
            <p id="bmi-value"></p>
            <p id="bmi-category"></p>
            <p id="result-el"></p>
        </section>
    </main>
    <script src="bmi.js"></script>
</body>
</html>
